name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS, not ubuntu: the library declares iOS targets, and only a macOS runner has the
    # toolchain to compile them. `:pixelate:build` covers android/jvm/js/wasmJs/iOS in one go.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build library (all targets)
        run: ./gradlew :pixelate:build --stacktrace

      - name: Build Android sample
        run: ./gradlew :sample:assembleDebug --stacktrace
